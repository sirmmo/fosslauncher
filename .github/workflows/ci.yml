# Checks for pull requests. Pushes to main and tags are built and packaged by release.yml.
name: ci
on:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
